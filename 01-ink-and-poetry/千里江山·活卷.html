<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>千里江山 · 活卷</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#211b15;}
body{font-family:"STKaiti","KaiTi","Kaiti SC","KaiTi_GB2312","楷体","BiauKai","Songti SC","STSong","SimSun",serif;color:#2a2018;user-select:none;-webkit-user-select:none;}
canvas{display:block;position:absolute;left:0;top:0;}
#c{touch-action:none;cursor:default;}
#m{display:none;z-index:5;touch-action:none;cursor:zoom-in;}
#ui{position:fixed;left:0;right:0;bottom:0;height:70px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;opacity:0;transition:opacity 1.4s ease;pointer-events:none;background:linear-gradient(to top,rgba(30,22,15,.34),rgba(30,22,15,0));z-index:4;}
#ui.show{opacity:1;pointer-events:auto;}
#ui b{font-weight:normal;font-size:16px;letter-spacing:.2em;color:rgba(246,236,212,.82);padding:8px 13px;cursor:pointer;position:relative;text-shadow:0 0 8px rgba(20,14,8,.7);transition:color .6s;}
#ui b:hover{color:#fffaf0;}
#ui b.on::after{content:"";position:absolute;left:50%;bottom:1px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#b8452a;}
#ui i{color:rgba(246,236,212,.3);font-style:normal;}
#stage{position:fixed;right:5vw;top:9vh;writing-mode:vertical-rl;opacity:0;transition:opacity 1.2s;pointer-events:none;z-index:3;color:rgba(36,26,18,.84);text-shadow:0 0 10px rgba(220,205,170,.9);}
#stage.show{opacity:1;}
#sn{display:block;font-size:42px;letter-spacing:.35em;}
#sd{display:block;font-size:15px;letter-spacing:.3em;color:rgba(36,26,18,.62);margin-right:14px;}
#sp{display:block;margin-right:18px;font-size:14px;pointer-events:auto;}
#sp em{font-style:normal;cursor:pointer;margin-bottom:.8em;display:inline-block;color:rgba(36,26,18,.45);}
#sp em.on{color:#a63d24;}
#note{position:fixed;writing-mode:vertical-rl;font-size:17px;letter-spacing:.28em;color:rgba(30,22,15,.92);text-shadow:0 0 8px rgba(232,218,184,1),0 0 3px rgba(232,218,184,1);opacity:0;transition:opacity 1.3s;pointer-events:none;z-index:6;}
#hint{position:fixed;left:0;right:0;bottom:12%;text-align:center;font-size:14px;letter-spacing:.45em;color:rgba(36,26,18,.6);text-shadow:0 0 8px rgba(225,210,176,.9);opacity:0;transition:opacity 2s;pointer-events:none;z-index:3;}
#tl{position:fixed;top:7vh;left:4vw;writing-mode:vertical-rl;font-size:22px;letter-spacing:.4em;color:rgba(36,26,18,.7);text-shadow:0 0 8px rgba(225,210,176,.9);opacity:0;transition:opacity 1.6s;pointer-events:none;z-index:3;}
#mui{display:none;}#mui>*{z-index:8;}#mlv,#mbar{pointer-events:none;}
#mlv{position:fixed;left:28px;bottom:32px;font-size:15px;letter-spacing:.2em;color:rgba(28,20,14,.55);text-shadow:0 0 6px rgba(235,222,190,.95);}
#mlv span{margin-right:.7em;transition:color .5s;}
#mlv span.cur{color:#a63d24;}
#mbar{position:fixed;left:28px;bottom:64px;font-size:13px;letter-spacing:.15em;color:rgba(28,20,14,.75);text-shadow:0 0 6px rgba(235,222,190,.95);}
#mbar span{display:inline-block;height:2px;background:rgba(28,20,14,.7);vertical-align:middle;margin-right:10px;box-shadow:0 0 4px rgba(235,222,190,.9);}
#mx{position:fixed;right:30px;top:24px;font-size:20px;letter-spacing:.2em;color:rgba(28,20,14,.7);text-shadow:0 0 8px rgba(235,222,190,1);cursor:pointer;font-weight:normal;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="m"></canvas>
<div id="ui"><b data-a="scroll">展卷</b><i>·</i><b data-a="tour">游览</b><i>·</i><b data-a="paint">观王希孟作画</b><i>·</i><b data-a="enter">入画</b><i>·</i><b data-a="time">昼夜</b><i>·</i><b data-a="sound">声</b><i>·</i><b data-a="clear">清空</b><i>·</i><b data-a="regen">重绘</b></div>
<div id="stage"><span id="sn"></span><span id="sd"></span><span id="sp"><em data-s="1">缓</em><em data-s="3">中</em><em data-s="10">疾</em></span></div>
<div id="note"></div>
<div id="hint"></div>
<div id="tl"></div>
<div id="mui"><div id="mbar"><span></span><em></em></div><div id="mlv"></div><b id="mx">出</b></div>
<script>
(()=>{
'use strict';
/* ================= 数理：随机、噪声 ================= */
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t),sstep=(a,b,x)=>smooth(clamp((x-a)/(b-a),0,1));
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
let R=mulberry(1),NS=1;
const rr=(a,b)=>a+(b-a)*R(),ri=(a,b)=>Math.floor(a+(b-a+1)*R()),pick=a=>a[Math.floor(R()*a.length)],chance=p=>R()<p;
const mr=(a,b)=>a+(b-a)*Math.random();
function h1(i){let h=Math.imul((i|0)^NS,0x27d4eb2d);h^=h>>>15;h=Math.imul(h,0x85ebca6b);h^=h>>>13;h=Math.imul(h,0xc2b2ae35);h^=h>>>16;return(h>>>0)/4294967296;}
function vn1(x){const i=Math.floor(x),f=x-i;return lerp(h1(i),h1(i+1),f*f*(3-2*f));}
function fbm1(x,o=4){let s=0,a=.5,t=0;for(let k=0;k<o;k++){s+=a*vn1(x+k*17.3);t+=a;x*=2.07;a*=.5;}return s/t;}
function h2(i,j){return h1(Math.imul(i,374761393)+Math.imul(j,668265263));}
function vn2(x,y){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return lerp(lerp(h2(i,j),h2(i+1,j),u),lerp(h2(i,j+1),h2(i+1,j+1),u),v);}
function fbm2(x,y,o=4){let s=0,a=.5,t=0;for(let k=0;k<o;k++){s+=a*vn2(x,y);t+=a;x*=2.03;y*=2.03;a*=.5;}return s/t;}
function vnT(x,y,p,salt=0){const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);const m=a=>((a%p)+p)%p+salt*977;
 return lerp(lerp(h2(m(i),m(j)),h2(m(i+1),m(j)),u),lerp(h2(m(i),m(j+1)),h2(m(i+1),m(j+1)),u),v);}
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const mix=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;}
const KAI='"STKaiti","KaiTi","Kaiti SC","KaiTi_GB2312","楷体","BiauKai","Songti SC","STSong","SimSun",serif';

/* ================= 矿物颜料 ================= */
const H=1000,PAPER=600;let W=12000;
const P={silk:[206,187,147],paper:[218,205,174],ink:[30,25,21],ochre:[160,108,64],green:[70,130,98],green2:[120,160,114],
 blue:[38,90,122],blue2:[74,122,142],cin:[176,58,36],gam:[196,158,72],white:[236,228,207],roof:[70,74,76],pine:[30,52,46],leaf:[38,58,44],water:[140,164,150],skin:[212,178,138]};
const GR={};
function grain(key,col,v,salt){const S=128,c=mk(S,S),x=c.getContext('2d'),d=x.createImageData(S,S),D=d.data;
 for(let j=0;j<S;j++)for(let i=0;i<S;i++){const k=(j*S+i)*4;
  let n=(vnT(i/16,j/16,8,salt)-.5)*v*1.4+(vnT(i/4,j/4,32,salt+3)-.5)*v*.7+(Math.random()-.5)*v*.9;
  if(Math.random()<.03)n+=v*1.6*Math.random();if(Math.random()<.025)n-=v*1.4*Math.random();
  D[k]=clamp(col[0]+n,0,255);D[k+1]=clamp(col[1]+n*.96,0,255);D[k+2]=clamp(col[2]+n*.9,0,255);D[k+3]=255;}
 x.putImageData(d,0,0);GR[key]=c;}
let SILKTILE,STAIN,BLOBS=[],BLOBC={},MISTSPR=[],GLOW;
function pat(c,key){const cache=c._pc||(c._pc={});return cache[key]||(cache[key]=c.createPattern(key==='silkTile'?SILKTILE:GR[key],'repeat'));}
function patScale(p,g,tx=0,ty=0){if(p.setTransform)p.setTransform(new DOMMatrix([g,0,0,g,tx,ty]));}

function initArt(){
 NS=77;
 grain('silk',P.silk,9,1);grain('ochre',P.ochre,26,2);grain('green',P.green,30,3);grain('green2',P.green2,26,4);
 grain('blue',P.blue,30,5);grain('blue2',P.blue2,24,6);grain('water',P.water,16,7);grain('cin',P.cin,24,8);grain('white',P.white,14,9);
 // 绢：经纬
 {const S=256,c=mk(S,S),x=c.getContext('2d'),d=x.createImageData(S,S),D=d.data;const row=[],col=[];
  for(let i=0;i<S;i++){row.push((Math.random()-.5)*9+(i%2?3.2:-3.2));col.push((Math.random()-.5)*7+(i%2?-2.4:2.4));}
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){const k=(j*S+i)*4;const over=((i>>1)+(j>>1))&1;
   let n=(over?row[j]*.9+col[i]*.3:row[j]*.3+col[i]*.9)+(vnT(i/32,j/32,8,11)-.5)*10+(Math.random()-.5)*5;
   D[k]=clamp(P.silk[0]+n,0,255);D[k+1]=clamp(P.silk[1]+n*.97,0,255);D[k+2]=clamp(P.silk[2]+n*.9,0,255);D[k+3]=255;}
  x.putImageData(d,0,0);x.lineWidth=1;
  for(let i=0;i<70;i++){x.strokeStyle=Math.random()<.5?'rgba(255,245,220,.07)':'rgba(90,70,40,.06)';const y=Math.random()*S,l=mr(20,140),x0=Math.random()*S;
   x.beginPath();x.moveTo(x0,y);x.lineTo(x0+l,y+mr(-1,1));x.stroke();x.beginPath();x.moveTo(x0-S,y);x.lineTo(x0-S+l,y);x.stroke();}
  SILKTILE=c;}
 // 墨韵/水渍晕 sprite：边缘积色
 for(let v=0;v<4;v++){const S=96,c=mk(S,S),x=c.getContext('2d'),d=x.createImageData(S,S),D=d.data;
  for(let j=0;j<S;j++)for(let i=0;i<S;i++){const dx=(i-S/2)/(S/2),dy=(j-S/2)/(S/2),r0=Math.hypot(dx,dy),an=Math.atan2(dy,dx);
   const rn=.72+.24*vn2(Math.cos(an)*1.7+v*9,Math.sin(an)*1.7+v*3);const r=r0/rn;
   let a=0;if(r<1)a=(.72+.28*sstep(.55,.96,r))*(1-sstep(.9,1,r))*(.8+.4*(vn2(i/8+v*20,j/8)-.5));
   const k=(j*S+i)*4;D[k]=D[k+1]=D[k+2]=0;D[k+3]=clamp(a*255,0,255);}
  x.putImageData(d,0,0);BLOBS.push(c);}
 // 云雾 = 留白：用绢的颜色写雾
 for(let v=0;v<6;v++){const w=512,h=128,c=mk(w,h),x=c.getContext('2d');
  for(let k=0;k<22;k++){const cx=w*mr(.14,.86),cy=h*mr(.4,.6),rw=w*mr(.1,.26),rh=h*mr(.2,.4);
   x.setTransform(rw,0,0,rh,cx,cy);const g=x.createRadialGradient(0,0,0,0,0,1);g.addColorStop(0,'rgba(0,0,0,.42)');g.addColorStop(.5,'rgba(0,0,0,.2)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(-1,-1,2,2);}
  x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-in';x.fillStyle=pat(x,'silkTile');x.fillRect(0,0,w,h);MISTSPR.push(c);}
 {const S=64,c=mk(S,S),x=c.getContext('2d'),g=x.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);g.addColorStop(0,'rgba(255,214,140,1)');g.addColorStop(.18,'rgba(255,170,90,.55)');g.addColorStop(1,'rgba(255,150,70,0)');x.fillStyle=g;x.fillRect(0,0,S,S);GLOW=c;}
}
function blobC(v,col){const k=v+'|'+col;if(BLOBC[k])return BLOBC[k];const c=mk(96,96),x=c.getContext('2d');x.drawImage(BLOBS[v],0,0);x.globalCompositeOperation='source-in';x.fillStyle=rgba(col,1);x.fillRect(0,0,96,96);return BLOBC[k]=c;}
function makeStain(){ // 岁月：霉斑、折痕、边缘磨损（世界坐标 1/8）
 const sw=Math.ceil(W/8),sh=Math.ceil(H/8),c=mk(sw,sh),x=c.getContext('2d'),d=x.createImageData(sw,sh),D=d.data;
 for(let j=0;j<sh;j++)for(let i=0;i<sw;i++){const k=(j*sw+i)*4;const y=j/sh;
  let v=1-.1*Math.pow(fbm2(i/60,j/14,4),1.6)-.06*sstep(.55,.9,fbm2(i/25+40,j/9,3))-.1*(1-sstep(0,.06,y))-.08*(1-sstep(0,.05,1-y));
  v-=.012*sstep(.6,.72,fbm2(i/12,j/12+90,3))*(1-sstep(.72,.86,fbm2(i/12,j/12+90,3)));
  D[k]=255*v;D[k+1]=250*v;D[k+2]=236*v;D[k+3]=255;}
 x.putImageData(d,0,0);
 for(let xx=PAPER/8+mr(40,70);xx<sw;xx+=mr(55,95)){x.strokeStyle='rgba(120,95,60,.22)';x.lineWidth=.7;x.beginPath();for(let j=0;j<=sh;j+=4)x.lineTo(xx+Math.sin(j*.3+xx)*.6,j);x.stroke();
  x.strokeStyle='rgba(255,250,235,.22)';x.beginPath();x.moveTo(xx+1,0);x.lineTo(xx+1,sh);x.stroke();}
 STAIN=c;}

/* ================= 画层：远 / 中 / 近 ================= */
const MCV=document.getElementById('c'),MC=MCV.getContext('2d');
let SW=innerWidth,SH=innerHeight,DPR=Math.min(2,devicePixelRatio||1),ds=SH/H;
let LY=[],RS=1;
function allocLayers(){
 RS=clamp(ds*DPR,.7,1.12);RS=Math.min(RS,Math.sqrt(15.5e6/(W*H)));
 const defs=[{k:.78,y0:0},{k:1,y0:0},{k:1,y0:470}];
 LY=defs.map(d=>{const rs=RS*d.k,h=H-d.y0,cv=mk(W*rs,h*rs),c=cv.getContext('2d');c._s=rs;c._v=[0,d.y0,W,H];c._base=[rs,0,0,rs,0,-d.y0*rs];c.setTransform(...c._base);return{cv,c,rs,y0:d.y0,h};});}
function clearLayers(){for(const l of LY){l.c.setTransform(1,0,0,1,0,0);l.c.clearRect(0,0,l.cv.width,l.cv.height);l.c.setTransform(...l.c._base);}}
const SCR=mk(2048,2048),SX=SCR.getContext('2d');
// 以“草稿纸”合成矿物色：填色→渐变/带状遮罩→挖空→落到画上
function fillMasked(c,path,bb,key,maskFn,alpha,after){
 const s=c._s,v=c._v;const bx0=Math.max(bb[0],v[0]),by0=Math.max(bb[1],v[1]),bx1=Math.min(bb[2],v[2]),by1=Math.min(bb[3],v[3]);
 if(bx1<=bx0||by1<=by0)return;let pw=Math.ceil((bx1-bx0)*s),ph=Math.ceil((by1-by0)*s);let k=1;
 if(pw>2048||ph>2048){k=Math.min(2048/pw,2048/ph);pw=Math.ceil(pw*k);ph=Math.ceil(ph*k);}const ss=s*k;
 SX.setTransform(1,0,0,1,0,0);SX.globalCompositeOperation='source-over';SX.globalAlpha=1;SX.clearRect(0,0,pw+2,ph+2);
 SX.setTransform(ss,0,0,ss,-bx0*ss,-by0*ss);
 const p=pat(SX,key);patScale(p,Math.max(1.15/ss,.035));SX.fillStyle=p;SX.fill(path);
 if(maskFn){SX.globalCompositeOperation='destination-in';maskFn(SX);}
 if(after){SX.globalCompositeOperation='destination-out';after(SX);}
 SX.globalCompositeOperation='source-over';SX.globalAlpha=1;
 c.globalAlpha=alpha;c.drawImage(SCR,0,0,pw,ph,bx0,by0,bx1-bx0,by1-by0);c.globalAlpha=1;}
function vmask(g,x0,x1,y0,y1,stops){const gr=g.createLinearGradient(0,y0,0,y1);for(const[o,a]of stops)gr.addColorStop(o,`rgba(0,0,0,${a})`);g.fillStyle=gr;g.fillRect(x0-5,Math.min(y0,-50),x1-x0+10,Math.max(y1,H+60)+60);}
function clipDo(c,ex,own,f){c.save();for(const p of ex)c.clip(p,'evenodd');if(own)c.clip(own);f();c.restore();}

/* ================= 笔：提按、飞白、渗化 ================= */
function brush(c,p,w,a,col,sd,dry,wet){
 const n=p.length;if(n<2)return;const r=mulberry(sd);const L=[0];let tot=0;
 for(let i=1;i<n;i++){tot+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);L.push(tot);}if(tot<=0)return;
 const lf=[],rt=[],ph=r()*50;
 for(let i=0;i<n;i++){const s=L[i]/tot;const press=Math.pow(Math.sin(PI*(.05+.9*s)),.5)*(.65+.7*vn1(ph+s*4))*(1+.4*Math.exp(-s*10));const wi=w*.5*press;
  const a0=p[Math.max(0,i-1)],a1=p[Math.min(n-1,i+1)];let dx=a1[0]-a0[0],dy=a1[1]-a0[1];const dl=Math.hypot(dx,dy)||1;dx/=dl;dy/=dl;
  lf.push([p[i][0]-dy*wi,p[i][1]+dx*wi]);rt.push([p[i][0]+dy*wi,p[i][1]-dx*wi]);}
 const poly=()=>{c.beginPath();c.moveTo(lf[0][0],lf[0][1]);for(let i=1;i<n;i++)c.lineTo(lf[i][0],lf[i][1]);for(let i=n-1;i>=0;i--)c.lineTo(rt[i][0],rt[i][1]);c.closePath();};
 if(wet){c.strokeStyle=rgba(col,a*.1);c.lineWidth=w*2.4;c.lineJoin='round';c.beginPath();c.moveTo(p[0][0],p[0][1]);for(let i=1;i<n;i++)c.lineTo(p[i][0],p[i][1]);c.stroke();}
 if(dry<=.05){c.fillStyle=rgba(col,a);poly();c.fill();return;}
 c.fillStyle=rgba(col,a*(1-dry)*.85);poly();c.fill();
 const k=3+(r()*3|0);c.strokeStyle=rgba(col,a*.9);c.lineCap='round';
 for(let j=0;j<k;j++){const o=(j+.5)/k;c.lineWidth=Math.max(w/k*.95,.15);c.beginPath();let pen=false;
  for(let i=0;i<n;i++){const s=L[i]/tot;if(r()<dry*(.12+.75*s*s)){pen=false;continue;}
   const x=lerp(lf[i][0],rt[i][0],o),y=lerp(lf[i][1],rt[i][1],o);if(pen)c.lineTo(x,y);else{c.moveTo(x,y);pen=true;}}
  c.stroke();}}
function strokes(c,arr,am=1){for(const s of arr)brush(c,s.p,s.w,s.a*am,s.col||P.ink,s.sd,s.dry,s.wet);}
function blobs(c,arr,col){for(const b of arr){c.globalAlpha=b[3];c.drawImage(col?blobC(b[4],col):BLOBS[b[4]],b[0]-b[2],b[1]-b[2]*.7,b[2]*2,b[2]*1.4);}c.globalAlpha=1;}

/* ================= 造山：千里之势 ================= */
let LANDS,OPS,FIGS,WALK,BOATS,FALLS,LIGHTS,SMOKES,MISTS,WPTS,SEGS,POIS,HGT,NTREES,PAINTER,SEED,idc;
function op(st,L,bb,f){OPS.push({st,L,bb,f,x:(bb[0]+bb[2])/2});}
function topAt(m,x){if(x<=m.x0||x>=m.x1)return m.base;const f=(x-m.x0)/m.st,i=Math.floor(f),t=f-i;return lerp(m.ys[i],m.ys[Math.min(i+1,m.n)],t);}
function inLand(m,x,y){return x>m.x0&&x<m.x1&&y>=topAt(m,x)-.5&&y<=m.base+26;}
function segAt(x){for(const s of SEGS)if(x<s.x1)return s;return SEGS[SEGS.length-1];}
function addLand(o){
 const m=Object.assign({sub:ri(1,3),k:rr(1.3,1.9),lean:rr(-.22,.22)},o);
 if(m.cx-m.w<PAPER+30){const d=PAPER+30-(m.cx-m.w);m.cx+=d*.5;m.w-=d*.5;}
 if(m.cx+m.w>W-20){const d=m.cx+m.w-(W-20);m.cx-=d*.5;m.w-=d*.5;}
 if(m.w<20)return null;

const AU={on:true,c:null};
function auInit(){if(AU.c||!AU.on)return;try{const C=new(window.AudioContext||window.webkitAudioContext)();AU.c=C;const sr=C.sampleRate,len=sr*5;
 const wb=C.createBuffer(1,len,sr),bb=C.createBuffer(1,len,sr),w=wb.getChannelData(0),b=bb.getChannelData(0);let l=0;for(let i=0;i<len;i++){const r=Math.random()*2-1;w[i]=r;l=(l+.02*r)/1.02;b[i]=l*3.5;}
 for(let i=0;i<2000;i++){const f=i/2000;w[i]*=f;b[i]*=f;w[len-1-i]*=f;b[len-1-i]*=f;}
 const master=C.createGain();master.gain.value=0;const comp=C.createDynamicsCompressor();master.connect(comp);comp.connect(C.destination);
 const rv=C.createConvolver(),ir=C.createBuffer(2,sr*3.2|0,sr);for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.8);}rv.buffer=ir;const rvg=C.createGain();rvg.gain.value=.45;rv.connect(rvg);rvg.connect(master);
 const src=buf=>{const s=C.createBufferSource();s.buffer=buf;s.loop=true;s.start(0,Math.random()*4);return s;};
 const pan=()=>C.createStereoPanner?C.createStereoPanner():null;
 const wF=C.createBiquadFilter();wF.type='bandpass';wF.frequency.value=420;wF.Q.value=.7;const wG=C.createGain();wG.gain.value=0;src(bb).connect(wF);wF.connect(wG);wG.connect(master);
 const sF=C.createBiquadFilter();sF.type='bandpass';sF.frequency.value=2600;sF.Q.value=.6;const sG=C.createGain();sG.gain.value=0;src(wb).connect(sF);sF.connect(sG);sG.connect(master);
 const fF=C.createBiquadFilter();fF.type='lowpass';fF.frequency.value=1000;const fF2=C.createBiquadFilter();fF2.type='highpass';fF2.frequency.value=3200;const f2g=C.createGain();f2g.gain.value=.1;
 const fG=C.createGain();fG.gain.value=0;src(bb).connect(fF);fF.connect(fG);src(wb).connect(fF2);fF2.connect(f2g);f2g.connect(fG);const fP=pan();if(fP){fG.connect(fP);fP.connect(master);}else fG.connect(master);
 AU.x={master,rv,wF,wG,sF,sG,fG,fP,wb,pan};master.gain.setTargetAtTime(AU.on?.85:0,C.currentTime,2);const n=C.currentTime;AU.nx={qin:n+3,bird:n+6,oar:n+2,cri:n+2,mod:0};}catch(e){AU.c=null;}}
function note(f,t,slide,vol=.04){const C=AU.c,x=AU.x,g=C.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+5.5);
 const o1=C.createOscillator(),o2=C.createOscillator(),g2=C.createGain();o1.type=o2.type='sine';o1.frequency.setValueAtTime(f*2,t);o2.frequency.setValueAtTime(f*4.01,t);g2.gain.value=.16;
 if(slide)o1.frequency.exponentialRampToValueAtTime(f*2*(Math.random()<.5?1.059:.944),t+1.3);o1.connect(g);o2.connect(g2);g2.connect(g);g.connect(x.master);g.connect(x.rv);o1.start(t);o2.start(t);o1.stop(t+6);o2.stop(t+6);}
function qin(){const C=AU.c,sc=[146.83,164.81,185,220,246.94,293.66,329.63,369.99,440,493.88];let t=C.currentTime+.05;for(let i=0,n=1+(Math.random()*3|0);i<n;i++){note(sc[2+(Math.random()*8|0)],t,Math.random()<.3);t+=.7+Math.random()*1.7;}}
function bird(){const C=AU.c,x=AU.x,now=C.currentTime,g=C.createGain(),p=x.pan();g.gain.value=0;if(p){p.pan.value=Math.random()*1.6-.8;g.connect(p);p.connect(x.master);p.connect(x.rv);}else g.connect(x.master);
 const o=C.createOscillator();o.type='sine';o.connect(g);let t=now+.02;const f0=2500+Math.random()*1900,vol=.01+Math.random()*.01;
 for(let i=0,n=2+(Math.random()*4|0);i<n;i++){const d=.05+Math.random()*.07;o.frequency.setValueAtTime(f0*(1+Math.random()*.1),t);o.frequency.exponentialRampToValueAtTime(f0*(Math.random()<.5?1.35:.75),t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.01);g.gain.linearRampToValueAtTime(0,t+d);t+=d+.04+Math.random()*.12;}
 o.start(now);o.stop(t+.1);}
function oar(v,pn){const C=AU.c,x=AU.x;for(let k=0;k<2;k++){const t=C.currentTime+k*.28,s=C.createBufferSource();s.buffer=x.wb;const f=C.createBiquadFilter();f.type='bandpass';f.frequency.value=k?1600:800;f.Q.value=.9;const g=C.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05*v*(k?.4:1),t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+.4);const p=x.pan();s.connect(f);f.connect(g);if(p){p.pan.value=pn;g.connect(p);p.connect(x.master);}else g.connect(x.master);s.start(t,Math.random()*3);s.stop(t+.5);}}
function cricket(){const C=AU.c,x=AU.x,t=C.currentTime,o=C.createOscillator(),g=C.createGain();o.frequency.value=4300+Math.random()*300;g.gain.value=0;o.connect(g);g.connect(x.master);
 for(let i=0;i<4;i++){g.gain.setValueAtTime(0,t+i*.06);g.gain.linearRampToValueAtTime(.004,t+i*.06+.01);g.gain.linearRampToValueAtTime(0,t+i*.06+.035);}o.start(t);o.stop(t+.3);}
function auUpdate(){const C=AU.c;if(!C)return;const now=C.currentTime,x=AU.x;if(now<AU.nx.mod)return;AU.nx.mod=now+.12;
 const quiet=MI||cam.s<ds*.6?.35:1,h=HGT[clamp(Math.round(cam.x/20),0,HGT.length-1)]||0,sg=segAt(cam.x).type,water=/lake|open|end/.test(sg)?1:sg==='village'?.6:.3;
 let fall=0,fpan=0;for(const f of FALLS){const d=Math.hypot(f.x-cam.x,(f.y1-cam.y)*.5)/(cam.s/ds);const v=Math.exp(-d/420);if(v>fall){fall=v;fpan=clamp((f.x-cam.x)*cam.s/(SW/2),-1,1);}}
 let bt=0,bpan=0;for(const b of BOATS){if(!b.shown||b.cx==null)continue;const v=1-Math.abs(b.cx-cam.x)*cam.s/(SW*.6);if(v>bt){bt=v;bpan=clamp((b.cx-cam.x)*cam.s/(SW/2),-1,1);}}
 x.wG.gain.setTargetAtTime((.02+.1*h)*(1-.5*LIT.night)*(.6+.8*vn1(T*.12))*quiet,now,.9);x.wF.frequency.setTargetAtTime(280+520*vn1(T*.09+5)+260*h,now,1.5);
 x.sG.gain.setTargetAtTime((.005+.022*water)*quiet*(.7+.6*vn1(T*.3+9)),now,.8);x.fG.gain.setTargetAtTime(.2*fall*quiet*(RP.on?.4:1),now,.8);if(x.fP)x.fP.pan.setTargetAtTime(fpan,now,.8);
 if(now>AU.nx.qin){qin();AU.nx.qin=now+(RP.on?mr(5,10):mr(10,24));}
 if(now>AU.nx.bird){if(LIT.night<.5&&Math.random()<.35+.5*h)bird();AU.nx.bird=now+mr(5,16);}
 if(bt>.1&&now>AU.nx.oar){oar(bt*quiet,bpan);AU.nx.oar=now+mr(2.6,4.2);}
 if(LIT.night>.5&&now>AU.nx.cri){cricket();AU.nx.cri=now+mr(1.4,4.5);}}

/* ================= 交互 ================= */
function syncUI(){document.querySelectorAll('#ui b').forEach(b=>{const a=b.dataset.a;b.classList.toggle('on',a==='tour'&&TOUR||a==='enter'&&MODE==='enter'||a==='scroll'&&MODE==='overview'||a==='sound'&&AU.on||a==='clear'&&CLEAR||a==='paint'&&RP.on&&RP.kind==='paint');});}
function tween(x1,y1,s1,d){TW={x0:cam.x,y0:cam.y,s0:cam.s,x1,y1,s1,t:0,d};}
function goOverview(){if(MODE==='enter')exitEnter();BACK={...cam};MODE='overview';tween(W/2,H/2,SW*.9/W,1.6);}
function goNormal(x){MODE='view';tween(clamp(x,SW/2/ds,W-SW/2/ds),500,ds,1.6);tourHold=T+6;}
function startEnter(){if(MODE==='overview'){cam.x=BACK?BACK.x:cam.x;cam.s=ds;cam.y=500;}MODE='enter';PAR.rx=cam.x;PAR.ry=cam.y;PAR.kt=1;
 const pois=POIS.filter(p=>p.x<cam.x+200&&p.type!=='summit').sort((a,b)=>b.x-a.x),su=POIS.find(p=>p.type==='summit'),list=[];let lx=cam.x;
 for(const p of pois.concat(su?[su]:[])){if(Math.abs(p.x-lx)>1500)list.push({x:(p.x+lx)/2,y:560,s:ds*1.5,dw:0});const z=p.type==='summit'?2.1:p.type==='peak'?1.55:1.85;
  list.push({x:p.x,y:p.type==='summit'?p.y+SH/2/(ds*z)*.7:p.type==='peak'?p.y+160:p.type==='fall'?p.y:p.y-30,s:ds*z,dw:p.type==='summit'?1e9:6,poi:p});lx=p.x;}
 if(!list.length)list.push({x:cam.x-800,y:560,s:ds*1.5,dw:1e9});ET={list,i:0,dw:0,man:0};hint('人在画中游',4);syncUI();}
function exitEnter(){MODE='view';PAR.kt=0;ET=null;tween(cam.x,500,ds,1.4);syncUI();}
function startPaint(){if(MI)microClose();if(MODE==='enter')exitEnter();if(MODE==='overview'){cam.x=BACK?BACK.x:cam.x;cam.s=ds;cam.y=500;TW=null;}CLEAR=false;MODE='paint';startReplay('paint');syncUI();}
const PH=[[.27,'清晨'],[.42,'上午'],[.74,'黄昏'],[.92,'月夜']];let todT=null;
function nextPhase(){let i=PH.findIndex(p=>p[0]>TOD+.01);if(i<0)i=0;todT={from:TOD,to:PH[i][0]<TOD?PH[i][0]+1:PH[i][0],t:0};tlabel(PH[i][1]);}
function regen(){if(MI)microClose();if(MODE==='enter')exitEnter();if(MODE==='overview'){cam.x=BACK?BACK.x:cam.x;cam.s=ds;cam.y=500;TW=null;}CLEAR=false;
 startReplay('regen');RP.regen=(Math.random()*1e6|0)+2;MODE='paint';syncUI();}
function action(a){auInit();switch(a){
 case'scroll':if(MI)microClose();MODE==='overview'?goNormal(BACK?BACK.x:cam.x):goOverview();break;
 case'tour':TOUR=!TOUR;tourHold=0;break;
 case'paint':startPaint();break;
 case'enter':if(MI)microClose();MODE==='enter'?exitEnter():startEnter();break;
 case'time':nextPhase();break;
 case'sound':AU.on=!AU.on;if(AU.on)auInit();if(AU.c)AU.x.master.gain.setTargetAtTime(AU.on?.85:0,AU.c.currentTime,.6);break;
 case'clear':if(RP.on)break;if(MODE==='enter')exitEnter();if(MODE==='overview')goNormal(BACK?BACK.x:cam.x);CLEAR=!CLEAR;if(CLEAR){ensureClear();MA.getContext('2d').clearRect(0,0,MA.width,MA.height);MB.getContext('2d').clearRect(0,0,MB.width,MB.height);TOUR=false;hint('以指代笔 · 移动即画',5);}break;
 case'regen':regen();break;}syncUI();}
$('ui').addEventListener('click',e=>{const b=e.target.closest('b');if(b)action(b.dataset.a);});
$('sp').addEventListener('click',e=>{const m=e.target.closest('em');if(!m||!RP.on)return;RP.speed=+m.dataset.s;document.querySelectorAll('#sp em').forEach(x=>x.classList.toggle('on',x===m));});
let uiT=0;function showUI(){$('ui').classList.add('show');uiT=T+2.6;}
function toWorld(sx,sy,p){const v=vf(p);return[v.x0+sx/v.s,v.y0+sy/v.s];}
function hitFig(sx,sy){let best=null,bd=1e9;const test=(x,y,L,r,o)=>{const v=vf(LP[L]),dx=(x-v.x0)*v.s-sx,dy=(y-v.y0)*v.s-sy,d=Math.hypot(dx,dy);if(d<Math.max(12,r*v.s)&&d<bd){bd=d;best=o;}};
 for(const f of FIGS)test(f.x,f.y,f.L,f.r,f);for(const w of WALK)if(w.shown&&w.text)test(w.cx,w.cy-5,1,10,w);for(const b of BOATS)if(b.shown&&b.text&&b.cx!=null)test(b.cx,b.cy-5,1,b.s,b);return best;}
let noteT=0;function showNote(o,sx,sy){const n=$('note');n.textContent=o.text;n.style.left=clamp(sx+14,10,SW-40)+'px';n.style.top=clamp(sy-140,10,SH-200)+'px';n.style.opacity=1;noteT=T+4.5;}
let pd=null;
MCV.addEventListener('pointerdown',e=>{auInit();pd={x:e.clientX,y:e.clientY,t:performance.now(),cx:cam.x,moved:0};MCV.setPointerCapture(e.pointerId);if(e.clientY>SH-90)showUI();});
MCV.addEventListener('pointermove',e=>{const px=mouse.x,py=mouse.y;mouse.x=e.clientX;mouse.y=e.clientY;mouse.nx=e.clientX/SW;mouse.ny=e.clientY/SH;
 if(e.clientY>SH-90||e.clientY<36)showUI();
 if(CLEAR&&MA){const w=toWorld(e.clientX,e.clientY,1),sp=Math.hypot(e.clientX-px,e.clientY-py);if(sp>.5)dab(w[0],w[1],clamp(.7+sp*.02,.7,1.6));}
 if(pd&&e.buttons){const dx=e.clientX-pd.x;pd.moved=Math.max(pd.moved,Math.abs(dx),Math.abs(e.clientY-pd.y));if(!CLEAR&&(MODE==='view'||MODE==='enter'||MODE==='paint'||MODE==='intro')){cam.x=pd.cx-dx/cam.s;tourHold=T+18;if(ET)ET.man=T+10;}}
 else if(MODE==='view'||MODE==='enter'||MODE==='intro'&&RP.stage===99){const f=hitFig(e.clientX,e.clientY);MCV.style.cursor=f?'pointer':'default';
  const w=toWorld(e.clientX,e.clientY,LP[0]);if(w[1]>610&&!anyLand(w[0],w[1])&&Math.hypot(e.clientX-px,e.clientY-py)>3&&(!RIP.length||T-RIP[RIP.length-1].t>.35))RIP.push({x:w[0],y:w[1],t:T});}});
MCV.addEventListener('pointerup',e=>{if(!pd)return;const click=pd.moved<6&&performance.now()-pd.t<600;pd=null;if(!click)return;onClick(e.clientX,e.clientY);});
function onClick(sx,sy){
 if(RP.on&&(RP.stage!==99||RP.pre>0)){if(RP.kind!=='paint'){if(RP.speed<6)RP.speed=7;else RP.ff=true;}return;}
 if(MODE==='overview'){const w=toWorld(sx,sy,1);goNormal(w[0]);syncUI();return;}
 if(CLEAR)return;const f=hitFig(sx,sy);
 if(f){if(f.painter){const w=toWorld(sx,sy,1);showNote(f,sx,sy);microOpen(PAINTER.x,PAINTER.y,(PAINTER.x-vf(1).x0)*cam.s,(PAINTER.y-vf(1).y0)*cam.s,true);return;}showNote(f,sx,sy);return;}
 if((MODE==='view'||MODE==='intro')&&!TW){const w=toWorld(sx,sy,1);if(w[1]>0&&w[1]<H&&w[0]>0&&w[0]<W){microOpen(w[0],w[1],sx,sy,false);hint('滚轮 / 轻触 深入 · 右键或「出」返回',4);}}}
MCV.addEventListener('wheel',e=>{e.preventDefault();if(MODE==='overview')return;const d=(Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX)*(e.deltaMode?30:1);cam.x-=d*.9/cam.s*(MODE==='enter'?.6:1);tourHold=T+18;if(ET)ET.man=T+10;},{passive:false});
MCV2.addEventListener('wheel',e=>{e.preventDefault();if(!MI)return;MI.zt=clamp(MI.zt*Math.exp(-e.deltaY*(e.deltaMode?.05:.0018)),1,MI.painter?400:1400);},{passive:false});
MCV2.addEventListener('pointerup',e=>{if(!MI)return;if(e.button===2)return;const nx=MLV.find(v=>v>MI.zt*1.1);MI.zt=MI.painter?Math.min(400,MI.zt*2.6):nx?nx*1.08:MI.zt;});
MCV2.addEventListener('contextmenu',e=>{e.preventDefault();if(MI)MI.zt=1;});
$('mx').addEventListener('click',()=>{if(MI)MI.zt=1;});
addEventListener('keydown',e=>{auInit();if(e.key==='Escape'){if(MI)MI.zt=1;else if(MODE==='enter')exitEnter();else if(MODE==='overview')goNormal(BACK?BACK.x:cam.x);else if(CLEAR){CLEAR=false;syncUI();}}
 if(e.key==='ArrowLeft'){cam.x-=120/cam.s*ds;tourHold=T+18;}if(e.key==='ArrowRight'){cam.x+=120/cam.s*ds;tourHold=T+18;}if(e.key===' '){TOUR=!TOUR;syncUI();}});
function resize(){SW=innerWidth;SH=innerHeight;DPR=Math.min(2,devicePixelRatio||1);const old=ds;ds=SH/H;MCV.width=SW*DPR|0;MCV.height=SH*DPR|0;MCV.style.width=SW+'px';MCV.style.height=SH+'px';if(old&&MODE!=='overview')cam.s*=ds/old;if(MODE==='overview')cam.s=SW*.9/W;}
addEventListener('resize',resize);

/* ================= 主循环 ================= */
let last=performance.now();
function update(dt){T+=dt;
 if(todT){todT.t+=dt/4;const e=smooth(Math.min(1,todT.t));TOD=lerp(todT.from,todT.to,e)%1;if(todT.t>=1)todT=null;}else TOD=(TOD+dt/720)%1;lightState();
 PAR.k+=(PAR.kt-PAR.k)*(1-Math.exp(-dt*1.2));PAR.rx+=(cam.x-PAR.rx)*(1-Math.exp(-dt*.25));PAR.ry+=(cam.y-PAR.ry)*(1-Math.exp(-dt*.3));
 if(TW){TW.t+=dt/TW.d;const e=smooth(Math.min(1,TW.t));cam.x=lerp(TW.x0,TW.x1,e);cam.y=lerp(TW.y0,TW.y1,e);cam.s=Math.exp(lerp(Math.log(TW.s0),Math.log(TW.s1),e));if(TW.t>=1)TW=null;}
 else if(MODE==='enter'&&ET&&T>ET.man){const tg=ET.list[Math.min(ET.i,ET.list.length-1)];let dx=(tg.x-cam.x)*(1-Math.exp(-dt*.5));dx=clamp(dx,-58*dt,58*dt);cam.x+=dx;
  cam.y+=(tg.y-cam.y)*(1-Math.exp(-dt*.5));cam.s=Math.exp(lerp(Math.log(cam.s),Math.log(tg.s),1-Math.exp(-dt*.45)));
  if(Math.abs(tg.x-cam.x)<10){ET.dw+=dt;if(ET.dw>tg.dw&&ET.i<ET.list.length-1){ET.i++;ET.dw=0;}if(tg.poi&&tg.poi.type==='summit'&&ET.dw>2&&!ET.said){ET.said=1;hint('千里江山 · 尽在脚下',6);}}}
 else if(MODE==='view'&&TOUR&&T>tourHold&&!MI&&!CLEAR){cam.x-=13*dt;if(cam.x<=SW/2/cam.s+1){tourHold=T+10;TW={x0:cam.x,y0:cam.y,s0:cam.s,x1:W-SW/2/cam.s,y1:500,s1:ds,t:0,d:14};}}
 if(MODE!=='overview'&&!TW){const hw=SW/2/cam.s,hh=SH/2/cam.s;cam.x=clamp(cam.x,hw,Math.max(hw,W-hw));cam.y=clamp(cam.y,Math.min(hh,500),Math.max(H-hh,500));}
 MISTK+=((RP.on?(RP.stage>=9&&RP.stage<99?1:RP.pre>0?1:0):MODE==='intro'?0:1)-MISTK)*(1-Math.exp(-dt*.8));
 stepReplay(dt);auUpdate();
 if(T>uiT&&!$('ui').matches(':hover'))$('ui').classList.remove('show');if(T>noteT)$('note').style.opacity=0;if(T>hintT)$('hint').style.opacity=0;if(T>tlT)$('tl').style.opacity=0;}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);if(MI)microFrame(dt);else render(dt);requestAnimationFrame(frame);}

/* ================= 开卷 ================= */
resize();initArt();
const d0=new Date();TOD=(d0.getHours()+d0.getMinutes()/60)/24;{const q=/t=([\d.]+)/.exec(location.hash);if(q)TOD=+q[1];}lightState();
genWorld(1113);makeStain();allocLayers();cam.s=ds;cam.x=W-SW/2/ds;cam.y=500;PAR.rx=cam.x;
{const q=/x=([\d.]+)/.exec(location.hash);if(q){cam.x=+q[1];PAR.rx=cam.x;}}
MISTK=0;MODE='intro';setTimeout(()=>{startReplay('intro');hint('轻触 · 可加速',3);},1600);
syncUI();requestAnimationFrame(frame);
})();
</script>
</body>

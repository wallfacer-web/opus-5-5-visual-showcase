<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>武松打虎 · 皮影戏</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--ink:#0b0705;--paper:#f1e3c4;--red:#c3382a;--gold:#d8b068;--dim:rgba(241,227,196,.62);--line:rgba(216,176,104,.26);--glass:rgba(16,10,7,.66)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:"Noto Serif SC","Songti SC","SimSun",serif;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
#c:active{cursor:grabbing}
.vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(5,3,2,.55) 100%)}
.brand{position:fixed;left:22px;top:18px;display:flex;align-items:center;gap:12px;pointer-events:none;z-index:5}
.seal{width:42px;height:42px;border-radius:6px;background:var(--red);color:#fbe9d0;font-family:"Ma Shan Zheng",serif;font-size:30px;line-height:44px;text-align:center;box-shadow:inset 0 0 0 2px rgba(0,0,0,.22),0 2px 12px rgba(0,0,0,.45)}
.brand h1{font-family:"Ma Shan Zheng",serif;font-weight:400;font-size:30px;letter-spacing:.12em;line-height:1;color:#f6e6c6;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.brand p{font-size:12px;letter-spacing:.32em;color:var(--dim);margin-top:6px}
.act{position:fixed;right:24px;top:20px;text-align:right;z-index:5;pointer-events:none}
.act b{display:block;font-size:12px;letter-spacing:.42em;color:var(--gold);font-weight:600}
.act span{display:block;font-family:"Ma Shan Zheng",serif;font-size:26px;letter-spacing:.14em;margin-top:4px;text-shadow:0 2px 10px rgba(0,0,0,.7);transition:opacity .5s}
.cap{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);width:min(780px,92vw);text-align:center;z-index:5;pointer-events:none}
.cap span{display:inline-block;padding:8px 20px;font-size:17px;letter-spacing:.08em;line-height:1.6;background:rgba(10,6,4,.58);border-radius:4px;opacity:0;transform:translateY(6px);transition:opacity .45s,transform .45s;text-shadow:0 1px 3px #000}
.cap span.on{opacity:1;transform:none}
.bar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(1000px,calc(100vw - 28px));display:flex;align-items:center;gap:14px;padding:9px 12px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:12px;z-index:6}
.ib{flex:none;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--paper);display:grid;place-items:center;cursor:pointer;font:inherit}
.ib:hover{background:rgba(216,176,104,.14)}
.ib svg{width:18px;height:18px;fill:currentColor}
.prog{flex:1;min-width:140px;position:relative;height:38px;cursor:pointer}
.track{position:absolute;left:0;right:0;top:11px;height:4px;background:rgba(241,227,196,.15);border-radius:2px}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#a92f22,#e0a24e);border-radius:2px}
.knob{position:absolute;top:-4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#f3d9a6;box-shadow:0 0 0 3px rgba(195,56,42,.5)}
.mk{position:absolute;top:-3px;width:1px;height:10px;background:rgba(241,227,196,.45)}
.lbl{position:absolute;top:21px;font-size:11px;color:var(--dim);white-space:nowrap;letter-spacing:.1em;padding-left:4px}
.lbl.on{color:var(--gold)}
.views{flex:none;display:flex;gap:3px;padding:3px;border:1px solid var(--line);border-radius:9px}
.views button{font:inherit;font-size:14px;letter-spacing:.14em;color:var(--dim);background:none;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.views button kbd{font-family:ui-monospace,Menlo,monospace;font-size:10px;opacity:.5}
.views button.on{background:var(--red);color:#fff4e2}
.views button:not(.on):hover{color:var(--paper)}
.free{position:fixed;left:50%;bottom:78px;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;color:var(--gold);z-index:6;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.free.on{opacity:.9}
.start{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,rgba(30,14,6,.25),rgba(8,5,3,.92) 72%);transition:opacity .9s}
.start.off{opacity:0;pointer-events:none}
.card{text-align:center;padding:24px}
.card .t{font-family:"Ma Shan Zheng",serif;font-size:clamp(64px,12vw,132px);letter-spacing:.12em;line-height:1.1;color:#f6e3bf;text-shadow:0 0 48px rgba(230,140,60,.35)}
.card .s{letter-spacing:.8em;color:var(--gold);font-size:14px;margin:8px 0 34px;padding-left:.8em}
.go{font-family:"Ma Shan Zheng",serif;font-size:28px;letter-spacing:.5em;padding:12px 28px 12px 42px;color:#fff1dc;background:var(--red);border:0;border-radius:10px;cursor:pointer;box-shadow:0 8px 30px rgba(195,56,42,.45);transition:transform .2s}
.go:hover{transform:translateY(-2px)}
.go:disabled{opacity:.5;cursor:wait;transform:none}
.load{margin-top:14px;font-size:12px;color:var(--dim);letter-spacing:.12em;min-height:1em}
.card p{margin-top:24px;font-size:13px;color:var(--dim);letter-spacing:.14em;line-height:2}
.err{position:fixed;inset:0;display:none;place-items:center;z-index:20;background:var(--ink);text-align:center;padding:30px;line-height:2}
@media (max-width:760px){
 .bar{flex-wrap:wrap;bottom:10px;gap:8px;padding:8px}
 .prog{order:3;flex-basis:100%;height:34px}
 .views{flex:1;justify-content:space-between}
 .views button{padding:7px 6px;letter-spacing:.06em}
 .views kbd{display:none}
 .cap{bottom:128px}.cap span{font-size:14px;padding:6px 12px}
 .free{bottom:124px}
 .brand{left:14px;top:12px}.brand h1{font-size:22px}.seal{width:34px;height:34px;font-size:24px;line-height:36px}
 .act{right:14px;top:14px}.act span{font-size:19px}
}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div class="vig"></div>
<header class="brand"><div class="seal">影</div><div><h1>武松打虎</h1><p>皮影戏 · 景阳冈</p></div></header>
<div class="act" id="act"><b id="actNo">序</b><span id="actName">开场</span></div>
<div class="cap"><span id="cap"></span></div>
<div class="free" id="free">自由视角 · 双击画面回到预设机位</div>
<nav class="bar">
  <button class="ib" id="play" title="播放 / 暂停（空格）"><svg viewBox="0 0 24 24" id="playIco"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg></button>
  <div class="prog" id="prog"><div class="track"><div class="fill" id="fill"></div><div class="knob" id="knob"></div></div></div>
  <div class="views" id="views">
    <button data-v="front" class="on">台前<kbd>1</kbd></button>
    <button data-v="close">近景<kbd>2</kbd></button>
    <button data-v="back">幕后<kbd>3</kbd></button>
    <button data-v="side">侧台<kbd>4</kbd></button>
  </div>
  <button class="ib" id="snd" title="锣鼓声（M）"><svg viewBox="0 0 24 24" id="sndIco"></svg></button>
</nav>
<div class="start" id="start"><div class="card">
  <div class="t">武松打虎</div>
  <div class="s">皮 影 戏</div>
  <button class="go" id="go" disabled>备场中</button>
  <div class="load" id="load">正在连接 three.js …</div>
  <p>台前 · 近景 · 幕后 · 侧台 四个机位随时切换<br>拖拽旋转 · 滚轮缩放 · 右键平移 · 数字键 1–4</p>
</div></div>
<div class="err" id="err"></div>

<script type="text/x-module" id="app-src">
import * as THREE from 'three';

/* ============================================================

   ============================================================ */
const PI = Math.PI, TAU = PI * 2;

const ph = (t, a, b) => clamp((t - a) / (b - a), 0, 1);

/* ============================================================

   ============================================================ */
const FONT_T = '"Ma Shan Zheng","STKaiti","KaiTi","Kaiti SC",serif';
const C = { ink: '#24120a', red: '#b8331d', green: '#2e7a48', yellow: '#d9a23a', blue: '#2d5b88', black: '#1d1612', tiger: '#dd8a26', tigerL: '#f1c466', stripe: '#2b1406', bark: '#7a4f2a', leaf: '#4a8a44', rock: '#9cafbd', wood: '#8f6031' };

function sp(pts, closed = true) {

function poly(pts) { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); return p; }

function leather(x, path, color, o = {}) {

/* ============================================================
   皮影：武松
   ============================================================ */
function drawWuHead() {
  const [c, x] = cv(106, 122);
  hollow(x, sp([[40, 92], [56, 94], [58, 122], [38, 122]]));

  x.lineWidth = 2; x.beginPath(); x.moveTo(79, 81); x.lineTo(86, 79); x.stroke();
  x.lineWidth = 2.6; x.beginPath(); x.moveTo(45, 47); x.lineTo(47, 72); x.stroke();
  x.restore();

}
function drawWuTorso() {
  const [c, x] = cv(112, 144);
  const body = sp([[44, 14], [60, 9], [74, 14], [86, 32], [92, 62], [88, 98], [86, 140], [28, 140], [24, 104], [26, 62], [32, 30]]);
  leather(x, body, C.red, { stroke: false });

function drawWuHips() {
  const [c, x] = cv(124, 100);
  const skirt = sp([[30, 12], [94, 12], [102, 56], [108, 90], [86, 96], [62, 88], [38, 96], [16, 90], [22, 56]]);

function drawUpperArm() {
  const [c, x] = cv(36, 78);

function drawForearm() {
  const [c, x] = cv(42, 88);
  leather(x, poly([[7, 4], [29, 4], [31, 46], [5, 46]]), C.red, { lw: 2.6 });
  cutStroke(x, spiral(18, 24, 6, 1.3, 1), 1.6); cut(x, circ(18, 9, 2.3), 1.2);

  hollow(x, sp([[8, 57], [28, 55], [36, 64], [33, 76], [20, 83], [9, 77], [6, 66]]), 2.6);

}
function drawThigh() {
  const [c, x] = cv(40, 88);
  leather(x, sp([[6, 6], [20, 2], [34, 6], [31, 50], [29, 78], [20, 85], [12, 78], [9, 50]]), '#5e3c2b', { lw: 2.6 });
  for (let i = 0; i < 4; i++) cut(x, circ(20, 22 + i * 15, 2), 1.1);

}
function drawShin() {
  const [c, x] = cv(74, 98);
  const leg = sp([[8, 4], [32, 4], [31, 40], [29, 70], [11, 70], [9, 40]]);
  leather(x, leg, '#dcbc80', { lw: 2.6 });
  x.save(); x.clip(leg); x.strokeStyle = C.ink; x.lineWidth = 1.8;
  for (let y = 10; y < 70; y += 12) { x.beginPath(); x.moveTo(6, y); x.lineTo(34, y + 9); x.moveTo(34, y); x.lineTo(6, y + 9); x.stroke(); }

function tex(c) { const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
function part(c, pivot, o = {}) {
  const s = o.s ?? S, w = c.width, h = c.height, k = o.tint ?? 1;
  const geo = new THREE.PlaneGeometry(w * s, h * s);
  geo.translate((w / 2 - pivot[0]) * s, (pivot[1] - h / 2) * s, 0);
  const t = tex(c);
  const mR = new THREE.MeshBasicMaterial({ map: t, alphaTest: .45, side: THREE.DoubleSide, fog: false }); mR.color.setScalar(k);
  const mM = new THREE.MeshStandardMaterial({ map: t, alphaTest: .45, side: THREE.DoubleSide, roughness: .9, emissive: 0xffffff, emissiveMap: t, emissiveIntensity: .22 * k }); mM.color.setScalar(k);
  const a = new THREE.Mesh(geo, mR); a.layers.set(1);
  const b = new THREE.Mesh(geo, mM);
  const g = new THREE.Group(); g.add(a, b); g.userData.c = c;
  return g;
}
function at(parent, child, j, dz = 0) { child.position.set(j[0] * S, j[1] * S, dz); parent.add(child); return child; }

function repeatTex(c, rx, ry) { const t = tex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t; }
function texFloor() {
  const [c, x] = cv(1024, 1024), h = 128;
  for (let r = 0; r < 8; r++) {
    let xo = -R() * 300;
    while (xo < 1024) {
      const len = 300 + R() * 420, b = [78 + R() * 30, 50 + R() * 18, 32 + R() * 12];
      x.fillStyle = `rgb(${b[0] | 0},${b[1] | 0},${b[2] | 0})`; x.fillRect(xo, r * h, len, h);
      for (let k = 0; k < 36; k++) { x.strokeStyle = `rgba(30,16,8,${.05 + R() * .12})`; x.lineWidth = 1 + R() * 2.2; const yy = r * h + R() * h; x.beginPath(); x.moveTo(xo, yy); x.bezierCurveTo(xo + len * .3, yy + R() * 8 - 4, xo + len * .6, yy + R() * 8 - 4, xo + len, yy + R() * 6 - 3); x.stroke(); }
      x.fillStyle = 'rgba(12,6,3,.85)'; x.fillRect(xo, r * h, 3, h); xo += len;
    }
    x.fillStyle = 'rgba(12,6,3,.9)'; x.fillRect(0, r * h, 1024, 3);
  }
  return repeatTex(c, 3, 3);
}
function texPlaster() {
  const [c, x] = cv(512, 512); x.fillStyle = '#3a2b22'; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 900; i++) { const cx = R() * 512, cy = R() * 512, r = 4 + R() * 40; const g = x.createRadialGradient(cx, cy, 0, cx, cy, r); g.addColorStop(0, R() < .5 ? 'rgba(0,0,0,.08)' : 'rgba(255,230,190,.05)'); g.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = g; x.fillRect(cx - r, cy - r, r * 2, r * 2); }
  return repeatTex(c, 4, 2);
}
function huiwen(x, X, Y, s) { x.beginPath(); x.moveTo(X, Y); x.lineTo(X + s, Y); x.lineTo(X + s, Y + s); x.lineTo(X + s * .2, Y + s); x.lineTo(X + s * .2, Y + s * .38); x.lineTo(X + s * .62, Y + s * .38); x.lineTo(X + s * .62, Y + s * .7); x.stroke(); }
function texLattice() {
  const [c, x] = cv(512, 1024); x.fillStyle = '#5e140e'; x.fillRect(0, 0, 512, 1024);
  x.strokeStyle = '#c49a4a'; x.lineWidth = 7; x.strokeRect(22, 22, 468, 980); x.lineWidth = 2; x.strokeRect(40, 40, 432, 944);
  x.fillStyle = '#240806'; x.fillRect(60, 60, 392, 560);
  x.strokeStyle = '#b98e44'; x.lineWidth = 4;
  for (let yy = 70; yy < 600; yy += 54) for (let xx = 70; xx < 440; xx += 54) huiwen(x, xx, yy, 40);
  x.lineWidth = 3; x.strokeRect(60, 60, 392, 560);
  x.fillStyle = '#6e1a12'; x.fillRect(60, 650, 392, 320); x.strokeRect(70, 660, 372, 300);
  x.beginPath(); x.arc(256, 810, 110, 0, TAU); x.stroke(); x.beginPath(); x.arc(256, 810, 96, 0, TAU); x.stroke();
  for (let i = 0; i < 8; i++) { const a = i / 8 * TAU; x.beginPath(); x.ellipse(256 + Math.cos(a) * 50, 810 + Math.sin(a) * 50, 38, 14, a, 0, TAU); x.stroke(); }
  x.beginPath(); x.arc(256, 810, 16, 0, TAU); x.stroke();
  return tex(c);
}
function texApron() {
  const [c, x] = cv(1024, 300); x.fillStyle = '#5e140e'; x.fillRect(0, 0, 1024, 300);
  x.strokeStyle = '#c49a4a'; x.lineWidth = 6; x.strokeRect(10, 10, 1004, 280);
  for (let i = 0; i < 3; i++) {
    const X = 40 + i * 322, W2 = 300; x.lineWidth = 3; x.strokeRect(X, 36, W2, 228); x.fillStyle = '#2a0906'; x.fillRect(X + 12, 48, W2 - 24, 204);
    x.lineWidth = 3.5; x.strokeStyle = '#b98e44';
    for (const [sx, d] of [[X + 90, 1], [X + 210, -1]]) { x.beginPath(); const p = spiral(sx, 150, 42, 1.6, d); x.stroke(p); }
    x.beginPath(); x.moveTo(X + 30, 220); x.bezierCurveTo(X + 100, 180, X + 200, 260, X + 270, 200); x.stroke();
    x.strokeStyle = '#c49a4a';
  }
  return tex(c);
}
function texHeader() {
  const [c, x] = cv(1024, 128); x.fillStyle = '#5e140e'; x.fillRect(0, 0, 1024, 128);
  x.strokeStyle = '#c49a4a'; x.lineWidth = 3; x.strokeRect(6, 6, 1012, 116);
  x.lineWidth = 3; for (let xx = 14; xx < 1000; xx += 30) { huiwen(x, xx, 14, 20); huiwen(x, xx, 92, 20); }

}
function texBoard(text, w, h, size, bg, fg) {
  const [c, x] = cv(w, h); x.fillStyle = bg; x.fillRect(0, 0, w, h);
  x.strokeStyle = fg; x.lineWidth = 6; x.strokeRect(10, 10, w - 20, h - 20); x.lineWidth = 2; x.strokeRect(22, 22, w - 44, h - 44);
  if (w > h) htext(x, text, w / 2, h / 2 + 4, size, fg); else vtext(x, text, w / 2, 70, (h - 120) / (text.length - 1), size, fg);
  return tex(c);
}
function glowTex() { const [c, x] = cv(128, 128); const g = x.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.25, 'rgba(255,220,160,.5)'); g.addColorStop(1, 'rgba(255,160,80,0)'); x.fillStyle = g; x.fillRect(0, 0, 128, 128); return tex(c); }
function texLantern() {

  x.strokeStyle = 'rgba(60,5,5,.55)'; x.lineWidth = 3; for (let i = 0; i < 16; i++) { x.beginPath(); x.moveTo(i * 16, 0); x.lineTo(i * 16, 128); x.stroke(); }

}

    var map = document.createElement('script'); map.type = 'importmap';
    map.textContent = JSON.stringify({ imports: { 'three': base + 'build/three.module.js', 'three/addons/': base + 'examples/jsm/' } });
    document.head.appendChild(map);
    var main = document.createElement('script'); main.type = 'module';
    main.textContent = document.getElementById('app-src').textContent;
    main.onerror = fail;
    document.body.appendChild(main);
    setTimeout(function () { if (document.getElementById('go').disabled) status.textContent = '网络较慢，仍在加载 …'; }, 12000);
  }, fail);
})();
</script>

<!doctype html>
<html lang="zh-CN">

<style>
:root{
  /* Layout: one lacquered theatre column — carved eave, backlit screen, caption plaque, control rail below */
  --lacquer:#140a06;
  --lacquer-2:#26130a;
  --wood:#5a2a13;
  --wood-hi:#8c4b22;
  --gold:#dcab50;
  --gold-soft:#a98140;
  --vermilion:#b72e1b;
  --paper:#f3e0b8;
  --paper-dim:#bea57b;
  --indigo:#2e3f68;
  --f-title:"Ma Shan Zheng","STXingkai","STKaiti","KaiTi",serif;
  --f-body:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 70% at 50% -10%,#43200e 0%,var(--lacquer) 62%) var(--lacquer);color:var(--paper);font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
.app{box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-inline:16px;padding-block:12px}
.theatre{width:min(100%,calc((100vh - 250px) * 16 / 9 + 40px),1380px);width:min(100%,calc((100dvh - 250px) * 16 / 9 + 40px),1380px);min-width:min(100%,300px)}
.eave{display:block;width:100%;height:auto}
.frame{position:relative;padding:1.4% 2% 1.2%;background:
  linear-gradient(90deg,#4a170c,#8e2818 3%,#5c1a0e 5%,#3a1309 50%,#5c1a0e 95%,#8e2818 97%,#4a170c);
  box-shadow:inset 0 0 0 2px #2a0d05,inset 0 0 0 4px var(--gold-soft),0 20px 50px #000a}
.screenwrap{position:relative;aspect-ratio:16/9;max-width:100%;background:#1a0b05;box-shadow:0 0 0 2px var(--gold),0 0 0 5px #2a0d05;overflow:hidden;touch-action:none}
canvas#stage{display:block;width:100%;height:100%;cursor:default}
canvas#stage.grab{cursor:grab}
canvas#stage.grabbing{cursor:grabbing}
canvas#stage.point{cursor:pointer}
.apron{height:clamp(10px,2.2vw,22px);background:
  repeating-linear-gradient(90deg,transparent 0 14px,#0004 14px 16px),
  linear-gradient(#7a3d1b,#4a210e 60%,#2b1206);border-top:2px solid var(--gold-soft);box-shadow:0 10px 24px #000c}
.startbtn{position:absolute;left:50%;top:76%;transform:translate(-50%,-50%);font-family:var(--f-title);font-size:clamp(22px,4.2vw,46px);letter-spacing:.25em;padding:.25em .6em .25em .85em;color:#2a0d05;background:radial-gradient(circle at 50% 40%,#f6d27a,#c9902e);border:3px solid #2a0d05;border-radius:999px;box-shadow:0 0 0 3px var(--gold),0 0 40px #f3b54a88;cursor:pointer}
.startbtn:hover{filter:brightness(1.08)}
.startbtn:focus-visible{outline:3px solid #fff;outline-offset:4px}
.below{width:100%;display:flex;flex-direction:column;gap:10px;min-width:0}
.caption{display:flex;align-items:center;gap:12px;min-height:3.4em;padding:10px 14px;background:linear-gradient(#2b150b,#1d0e07);border:1px solid #5e3a1c;border-radius:6px;box-shadow:inset 0 1px 0 #ffffff10;min-width:0}
.caption[hidden]{display:none!important}
.who{flex:none;writing-mode:horizontal-tb;font-family:var(--f-title);font-size:clamp(15px,1.9vw,20px);color:#fff4dc;background:var(--vermilion);padding:.18em .5em;border-radius:3px;box-shadow:0 0 0 2px #2a0d05,0 0 0 3px var(--gold-soft);letter-spacing:.08em}
.who.narr{background:var(--indigo)}
.who.act{background:#b8862c;color:#2a0d05}
.line{margin:0;font-size:clamp(16px,2vw,22px);line-height:1.5;font-weight:700;color:var(--paper);text-wrap:balance;min-width:0}
.actbtn{flex:none;margin-left:auto;font:inherit;font-weight:700;font-size:clamp(14px,1.6vw,17px);padding:.45em .9em;border-radius:999px;border:2px solid #2a0d05;background:radial-gradient(circle at 40% 35%,#ffe6a0,#d39a33);color:#2a0d05;cursor:pointer;box-shadow:0 0 0 2px var(--gold),0 0 18px #f8c35c88}
.rail{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rail button,.rail select{font:inherit;font-size:clamp(13px,1.4vw,15px);font-weight:700;color:var(--paper);background:#2a160c;border:1px solid #6b4422;border-radius:6px;padding:.5em .85em;cursor:pointer;min-height:40px}
.rail button:hover,.rail select:hover{border-color:var(--gold)}
.rail button:focus-visible,.rail select:focus-visible,.actbtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.rail button.primary{background:var(--vermilion);border-color:#e0794a;color:#fff6e2;min-width:5.5em}
.seg{display:inline-flex;border:1px solid #6b4422;border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;background:#2a160c}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2a0d05}
.rail button.tog[aria-pressed="false"]{color:var(--paper-dim);background:#1b0e07}
.sel{display:inline-flex;align-items:center;gap:6px;color:var(--paper-dim);font-size:14px}
.rail select{appearance:none;-webkit-appearance:none;padding-right:1.6em;background-image:linear-gradient(45deg,transparent 50%,var(--gold) 50%),linear-gradient(135deg,var(--gold) 50%,transparent 50%);background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.spacer{flex:1}
.time{font-variant-numeric:tabular-nums;color:var(--paper-dim);font-size:14px}
.progress{position:relative;height:16px;cursor:pointer;touch-action:none}
.progress .track{position:absolute;left:0;right:0;top:6px;height:4px;background:#3a2112;border-radius:2px}
.progress .fill{position:absolute;left:0;top:6px;height:4px;background:linear-gradient(90deg,var(--gold-soft),var(--gold));border-radius:2px;width:0}
.progress .tick{position:absolute;top:2px;width:2px;height:12px;background:#6b4422}
.progress .knob{position:absolute;top:2px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 2px #2a0d05}
.note{margin:0;color:var(--paper-dim);font-size:12px;text-align:center}
@media (orientation:landscape) and (max-height:560px){
  .app{flex-direction:row;align-items:center;gap:14px}
  .theatre{width:min(calc((100vh - 40px) * 16 / 9 * 0.9),calc(100% - 290px));width:min(calc((100dvh - 40px) * 16 / 9 * 0.9),calc(100% - 290px));flex:none}
  .eave{display:none}
  .below{width:auto;flex:1;max-width:340px}
  .note{display:none}
}
@media (prefers-reduced-motion:reduce){.startbtn{transition:none}}
</style>

<div class="app">
  <div class="theatre">
    <svg class="eave" viewBox="0 0 1000 78" aria-hidden="true">

      <g stroke="#0006" stroke-width="2">
        <path d="M80 16v26M120 16v26M160 16v26M200 16v26M240 16v26M280 16v26M320 16v26M360 16v26M640 16v26M680 16v26M720 16v26M760 16v26M800 16v26M840 16v26M880 16v26M920 16v26"/>
      </g>
      <rect x="20" y="44" width="960" height="30" fill="url(#beam)"/>

      <text x="500" y="67" text-anchor="middle" font-family="Ma Shan Zheng, STKaiti, KaiTi, serif" font-size="27" fill="#f1c76a" letter-spacing="6">灯影戏台</text>
    </svg>
    <div class="frame">
      <div class="screenwrap" id="screenwrap">
        <canvas id="stage" aria-label="皮影戏舞台：孙悟空借芭蕉扇"></canvas>

      <div class="track"></div><div class="fill" id="fill"></div><div class="knob" id="knob"></div>
    </div>
    <div class="rail">
      <button class="primary" id="btnPlay">开演</button>
      <button id="btnRestart">重新开演</button>
      <div class="seg" role="group" aria-label="演出模式">
        <button id="mAuto" aria-pressed="true">自动演出</button>
        <button id="mInt" aria-pressed="false">互动体验</button>

      <label class="sel"><span>章节</span><select id="chap"></select></label>

      <button class="tog" id="btnSnd" aria-pressed="true">声音 开</button>

      <span class="time" id="time">0:00 / 3:20</span>
    </div>

  </div>

<script>
"use strict";
/* ================= 基础工具 ================= */
const W=1600,H=900,GROUND=792,TAU=Math.PI*2,D=Math.PI/180;
const cv=document.getElementById('stage');
let ctx=cv.getContext('2d');
const mainCtx=ctx;
let SC=1, QUALITY=true;
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ss=t=>{t=clamp(t);return t*t*(3-2*t)};
const io=t=>{t=clamp(t);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2};
const outC=t=>{t=clamp(t);return 1-Math.pow(1-t,3)};
const inC=t=>{t=clamp(t);return t*t*t};
const backO=t=>{t=clamp(t);const c1=1.9,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const EASE={lin:t=>t,io,out:outC,in:inC,back:backO,step:t=>t<1?0:1};
const bump=(t,a,b)=>Math.sin(Math.PI*seg(t,a,b));           // 0→1→0
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647}
function col(c,a=1){return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`}
function mix(a,b,t){return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)]}
function shade(c,k){return [c[0]*k,c[1]*k,c[2]*k]}
const PAL={
  verm:[198,50,28], ochre:[182,108,40], indigo:[44,64,116], gold:[224,170,56], ink:[46,22,10],
  jade:[56,124,84], cream:[244,224,176], plum:[120,32,44], teal:[44,98,108], red2:[170,40,30],
  slate:[78,86,104], fur:[196,128,52]
};
const OUT='rgba(48,20,6,0.92)';

/* 关键帧轨道：每个关键帧继承前一帧，数值插值；字段可带缓动 */
function track(keys){
  const ks=[];let cur={};
  for(const k of keys){cur={...cur,...k[1]};ks.push({t:k[0],v:cur,e:EASE[k[2]||'io']});}
  return lt=>{
    if(lt<=ks[0].t) return {...ks[0].v};
    for(let i=0;i<ks.length-1;i++){
      const a=ks[i],b=ks[i+1];
      if(lt<b.t){const p=b.e(seg(lt,a.t,b.t));const r={};
        for(const k in b.v){const vb=b.v[k],va=(k in a.v)?a.v[k]:vb;r[k]=(typeof vb==='number')?lerp(va,vb,p):(p<1?va:vb);}
        return r;}
    }
    return {...ks[ks.length-1].v};
  };
}
function add(P,o,k=1){for(const n in o){P[n]=(P[n]||0)+o[n]*k}return P}

/* ================= 镂空形状 ================= */
function hC(p,x,y,r){p.moveTo(x+r,y);p.arc(x,y,r,0,TAU)}
function hD(p,x,y,w,h){p.moveTo(x,y-h);p.lineTo(x+w,y);p.lineTo(x,y+h);p.lineTo(x-w,y);p.closePath()}
function hL(p,x,y,len,wid,ang){
  const c=Math.cos(ang),s=Math.sin(ang),hx=c*len/2,hy=s*len/2,nx=-s*wid,ny=c*wid;
  p.moveTo(x-hx,y-hy);p.quadraticCurveTo(x+nx,y+ny,x+hx,y+hy);p.quadraticCurveTo(x-nx,y-ny,x-hx,y-hy);p.closePath();
}
function hFlower(p,x,y,r,n=5,rot=0){
  for(let i=0;i<n;i++){const a=rot+i*TAU/n;hL(p,x+Math.cos(a)*r*.62,y+Math.sin(a)*r*.62,r*.66,r*.2,a)}
  hC(p,x,y,r*.16);
}
function limbPath(L,w0,w1){
  const p=new Path2D();
  p.moveTo(-w0/2,0);p.lineTo(-w1/2,L);p.arc(0,L,w1/2,Math.PI,0,true);p.lineTo(w0/2,0);p.arc(0,0,w0/2,0,Math.PI,true);p.closePath();
  return p;
}
let SHADE=1;
function part(p,c,a=.86,lw=2){
  if(QUALITY){ctx.shadowColor='rgba(50,18,0,.38)';ctx.shadowBlur=5*SC;ctx.shadowOffsetY=1.5*SC;}
  ctx.fillStyle=col(shade(c,SHADE),a);ctx.fill(p,'evenodd');
  ctx.shadowBlur=0;ctx.shadowOffsetY=0;ctx.shadowColor='transparent';
  ctx.lineWidth=lw;ctx.strokeStyle=OUT;ctx.stroke(p);
}
function joint(r=3.2){ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fillStyle='rgba(230,190,110,.9)';ctx.fill();ctx.lineWidth=1.4;ctx.strokeStyle=OUT;ctx.stroke()}
/* 带节纹的翎子 / 尾巴 */
function plume(x,y,len,a0,curl,w,c1,c2,n=16,taper=.75){
  let px=x,py=y,a=a0;const st=len/n;ctx.lineCap='round';
  for(let i=0;i<n;i++){
    const nx=px+Math.cos(a)*st,ny=py+Math.sin(a)*st;
    ctx.strokeStyle=(i%2)?c1:c2;ctx.lineWidth=Math.max(1,w*(1-i/n*taper));
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(nx,ny);ctx.stroke();
    px=nx;py=ny;a+=curl/n;
  }
  return [px,py];
}
function M(){const m=ctx.getTransform();return [m.e/SC,m.f/SC]}

/* ================= 声音：Web Audio 合成锣鼓 ================= */
const Snd={
  c:null,master:null,on:true,
  init(){
    if(this.c) {if(this.c.state==='suspended')this.c.resume();return;}
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    const c=this.c=new AC();
    this.master=c.createGain();this.master.gain.value=this.on?.75:0;
    const comp=c.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
    this.master.connect(comp);comp.connect(c.destination);
    const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    this.noise=buf;
    // 褐噪声用于火焰低吼
    const b2=c.createBuffer(1,len,c.sampleRate),d2=b2.getChannelData(0);let last=0;
    for(let i=0;i<len;i++){last=(last+.02*(Math.random()*2-1))/1.02;d2[i]=last*3.2}
    this.brown=b2;
    this.fire=this.loop(this.brown,'lowpass',520);
    this.crack=this.loop(this.noise,'bandpass',2600,6);
    this.rain=this.loop(this.noise,'highpass',3200);
    this.wind=this.loop(this.noise,'bandpass',600,1.2);
  },
  loop(buf,type,f,q=.7){
    const c=this.c,s=c.createBufferSource();s.buffer=buf;s.loop=true;
    const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;
    const g=c.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(this.master);s.start();
    return {g,fl};
  },
  setLoop(l,v,f){if(!this.c||!l)return;const t=this.c.currentTime;l.g.gain.setTargetAtTime(v,t,.12);if(f)l.fl.frequency.setTargetAtTime(f,t,.25)},
  setOn(v){this.on=v;if(this.master)this.master.gain.setTargetAtTime(v?.75:0,this.c.currentTime,.05)},
  ok(){return this.c&&this.c.state==='running'},
  env(node,t,a,peak,dec){const g=this.c.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0005,t+a+dec);node.connect(g);g.connect(this.master);return g},
  hit(t,dur,type,f,q,vol){const c=this.c,s=c.createBufferSource();s.buffer=this.noise;const fl=c.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q;s.connect(fl);this.env(fl,t,.003,vol,dur);s.start(t,Math.random());s.stop(t+dur+.1)},
  osc(t,type,f0,f1,dur,vol,a=.004){const c=this.c,o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur*.8);this.env(o,t,a,vol,dur);o.start(t);o.stop(t+dur+.1)},
  /* 大锣「仓」：音高略降 */
  gong(w=0,v=1){if(!this.ok())return;const t=this.c.currentTime+w;
    [1,1.48,2.13,2.76,3.52].forEach((r,i)=>this.osc(t,'sine',148*r*1.04,148*r*.96,2.2-i*.3,.16*v/(i*.7+1)));
    this.hit(t,.35,'bandpass',1500,.8,.12*v);},
  /* 小锣「台」：音高上扬 */
  luo(w=0,v=1){if(!this.ok())return;const t=this.c.currentTime+w;
    this.osc(t,'sine',640,760,.85,.12*v);this.osc(t,'sine',1330,1560,.5,.04*v);this.hit(t,.12,'bandpass',3200,1.5,.05*v);},
  /* 堂鼓「冬」 */
  drum(w=0,v=1){if(!this.ok())return;const t=this.c.currentTime+w;
    this.osc(t,'sine',150,58,.32,.42*v,.002);this.hit(t,.05,'lowpass',900,.7,.18*v);},
  /* 板「八」 */
  ban(w=0,v=1){if(!this.ok())return;const t=this.c.currentTime+w;
    this.hit(t,.045,'bandpass',2300,3,.3*v);this.hit(t+.012,.03,'bandpass',3600,4,.18*v);},
  /* 铙钹「才」 */
  bo(w=0,v=1){if(!this.ok())return;const t=this.c.currentTime+w;
    this.hit(t,.55,'highpass',5200,.6,.09*v);this.hit(t,.3,'bandpass',7600,2,.05*v);},
  /* 锣鼓经：C仓 c才 t台 d冬 b八 . 空 */
  jing(seq,step=.18,w=0,v=1){[...seq].forEach((ch,i)=>{const at=w+i*step;
    if(ch==='C'){this.gong(at,v);this.bo(at,v*.8)}else if(ch==='c')this.bo(at,v*.7);
    else if(ch==='t')this.luo(at,v);else if(ch==='d')this.drum(at,v);else if(ch==='b')this.ban(at,v);});},
  whoosh(w=0,dur=1.2,v=1,f0=300,f1=1400){if(!this.ok())return;const c=this.c,t=c.currentTime+w;
    const s=c.createBufferSource();s.buffer=this.noise;const fl=c.createBiquadFilter();fl.type='bandpass';fl.Q.value=1.4;
    fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur*.4);fl.frequency.exponentialRampToValueAtTime(f0*.8,t+dur);
    s.connect(fl);this.env(fl,t,dur*.25,.35*v,dur*.75);s.start(t,Math.random());s.stop(t+dur+.2);},
  flare(w=0){if(!this.ok())return;const c=this.c,t=c.currentTime+w;
    const s=c.createBufferSource();s.buffer=this.brown;const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(200,t);fl.frequency.exponentialRampToValueAtTime(1800,t+.5);

  drawWind(E.wind);
  for(const a of fr.actors)drawChar(a[0],a[1],a[2]);
  fr.front&&fr.front();
  drawRain(E.rain);
  drawRods();
  if(fr.hint)fr.hint();
  if(fr.plaque)drawPlaque(fr.plaque[0],fr.plaque[1],fr.plaque[2]);
  if(E.light<1){ctx.fillStyle=`rgba(12,4,0,${clamp(1-E.light)})`;ctx.fillRect(0,0,W,H)}
  drawCurtains(E.curtain);drawValance();
  if(fr.title)drawTitleCard(fr.title[0],fr.title[1],fr.title[2]);
  // 环境声
  if(Snd.c){const on=PL.playing?1:0,l=E.light;
    Snd.setLoop(Snd.fire,on*Math.min(.6,(E.fire*.16+E.bright*.35)*l),380+E.fire*260);
    Snd.setLoop(Snd.crack,on*E.fire*.03*l*(Math.random()<.15?2.6:1));
    Snd.setLoop(Snd.rain,on*E.rain*.13);
    const wa=E.wind?E.wind.amt:0;Snd.setLoop(Snd.wind,on*wa*.26,420+wa*700);}
  return I;
}

/* ---------- 字幕 ---------- */
const whoEl=document.getElementById('who'),lineEl=document.getElementById('line'),actBtn=document.getElementById('actBtn'),capEl=document.getElementById('caption');
let capKey='';
function updateCaption(force){
  let who='',text='',kind='',btn='';
  if(!PL.started){who='戏单';text='点击「开演」，锣鼓响起，好戏开场。';kind='narr'}
  else{const {sc,lt,gs}=cur();
    if(isGated(sc,gs,lt)){who='互动';kind='act';text=sc.gate.prompt;
      if(sc.key==='s6'){const n=gs.swings.n;const tag=['','一扇，熄火。','二扇，生风。','三扇，下雨！'][n];text=n?`已挥 ${n}/3 · ${tag}${n<3?' 继续挥扇！':''}`:sc.gate.prompt;if(n<3)btn='挥扇'}
      else if(sc.key==='s4')btn='服下定风丹';
      else if(sc.key==='s3'&&gs.w>.3)text='蓄力足了——松手！';}
    else if(PL.subs){const c=(sc.caps||[]).find(c=>lt>=c[0]&&lt<c[1]);if(c){who=c[2];text=c[3];kind=(c[2]==='旁白'||c[2]==='戏单'||c[2]==='谢幕')?'narr':''}}
  }
  const key=who+'|'+text+'|'+btn+'|'+PL.subs;if(key===capKey&&!force)return;capKey=key;
  if(!PL.subs&&!text){capEl.style.visibility='hidden';return}
  capEl.style.visibility='visible';
  whoEl.textContent=who||'　';whoEl.className='who'+(kind?' '+kind:'');whoEl.style.visibility=who?'visible':'hidden';
  lineEl.textContent=text||'';actBtn.hidden=!btn;if(btn)actBtn.textContent=btn;
}

/* ---------- 交互 ---------- */
function toLogical(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
function activeGate(){const {sc,lt,gs}=cur();return isGated(sc,gs,lt)?{sc,gs}:null}
const ptr={down:false,sx:0,sy:0,lx:0,acc:0,moved:0};
function usePill(){const g=GS.s4;if(g.used)return;g.used=true;g.useG=G;Snd.gulp();Snd.chime(.15);Snd.gong(.3,.6);setTimeout(()=>{release(SCENES[4],9)},900);updateCaption(true)}
function doSwing(){const g=GS.s6;if(g.swings.n>=3||G-g.swings.lastG<.9)return;g.swings.lastG=G;swingSfx(g.swings.n);g.swings.n++;updateCaption(true)}
cv.addEventListener('pointerdown',e=>{
  const a=activeGate();if(!a)return;if(!PL.playing)play();
  e.preventDefault();cv.setPointerCapture(e.pointerId);const [x,y]=toLogical(e);
  Object.assign(ptr,{down:true,sx:x,sy:y,lx:x,acc:0,moved:0});
  if(a.sc.key==='s3'){a.gs.drag=true;cv.className='grabbing'}
  if(a.sc.key==='s4'){if(Math.hypot(x-PILL.x,y-PILL.y)<110)usePill()}
});
cv.addEventListener('pointermove',e=>{
  const [x,y]=toLogical(e);const a=activeGate();
  if(!ptr.down){cv.className=a?(a.sc.key==='s3'?'grab':a.sc.key==='s4'?(Math.hypot(x-PILL.x,y-PILL.y)<110?'point':''):'grab'):'';return}
  if(!a)return;ptr.moved+=Math.abs(x-ptr.lx);
  if(a.sc.key==='s3'){a.gs.w=clamp(Math.hypot(x-ptr.sx,y-ptr.sy)/240);updateCaption()}
  if(a.sc.key==='s6'){ptr.acc+=Math.abs(x-ptr.lx);if(ptr.acc>150){doSwing();ptr.acc=0}}
  ptr.lx=x;
});
function endPtr(){
  if(!ptr.down)return;ptr.down=false;const a=activeGate();cv.className='';
  if(a&&a.sc.key==='s3'){a.gs.drag=false;if(a.gs.w>.3){Snd.ban();release(a.sc,8+2.5*a.gs.w)}}
  if(a&&a.sc.key==='s6'&&ptr.moved<12)doSwing();
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
actBtn.addEventListener('click',()=>{const a=activeGate();if(!a)return;if(!PL.playing)play();if(a.sc.key==='s4')usePill();if(a.sc.key==='s6')doSwing()});

/* ---------- 控制栏 ---------- */
const $=id=>document.getElementById(id);
const startBtn=$('startBtn'),btnPlay=$('btnPlay'),chap=$('chap'),fill=$('fill'),knob=$('knob'),prog=$('progress'),timeEl=$('time');
SCENES.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.name;chap.appendChild(o);
  if(i>0){const t=document.createElement('div');t.className='tick';t.style.left=(s.start/TOTAL*100)+'%';prog.appendChild(t)}});
const fmt=t=>`${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
function syncUI(){
  btnPlay.textContent=PL.ended?'重新开演':!PL.started?'开演':PL.playing?'暂停':'继续';
  $('mAuto').setAttribute('aria-pressed',PL.mode==='auto');$('mInt').setAttribute('aria-pressed',PL.mode==='int');
  $('btnSub').setAttribute('aria-pressed',PL.subs);$('btnSub').textContent='字幕 '+(PL.subs?'开':'关');
  $('btnSnd').setAttribute('aria-pressed',Snd.on);$('btnSnd').textContent='声音 '+(Snd.on?'开':'关');
}
function syncProgress(){const p=PL.T/TOTAL*100;fill.style.width=p+'%';knob.style.left=p+'%';timeEl.textContent=`${fmt(PL.T)} / ${fmt(TOTAL)}`;
  const i=sceneIdx(PL.T);if(+chap.value!==i&&document.activeElement!==chap)chap.value=i}
startBtn.onclick=()=>{play()};
btnPlay.onclick=()=>{if(PL.ended){seek(0);play()}else if(PL.playing)pause();else play()};
$('btnRestart').onclick=()=>{seek(0);play()};
function setMode(m){if(PL.mode===m)return;PL.mode=m;const {sc}=cur();seek(PL.started?sc.start:0);syncUI();updateCaption(true)}
$('mAuto').onclick=()=>setMode('auto');$('mInt').onclick=()=>setMode('int');
chap.onchange=()=>{seek(SCENES[+chap.value].start);play()};
$('btnSub').onclick=()=>{PL.subs=!PL.subs;syncUI();updateCaption(true)};
$('btnSnd').onclick=()=>{Snd.init();Snd.setOn(!Snd.on);syncUI()};
let scrub=false;
function scrubTo(e){const r=prog.getBoundingClientRect();seek(clamp((e.clientX-r.left)/r.width)*TOTAL)}
prog.addEventListener('pointerdown',e=>{scrub=true;prog.setPointerCapture(e.pointerId);scrubTo(e);if(!PL.started)play()});
prog.addEventListener('pointermove',e=>{if(scrub)scrubTo(e)});
prog.addEventListener('pointerup',()=>{scrub=false});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!(e.target instanceof HTMLButtonElement||e.target instanceof HTMLSelectElement)){e.preventDefault();btnPlay.click()}});

/* ---------- 尺寸与主循环 ---------- */
function resize(){const r=cv.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(window.devicePixelRatio||1,2);
  const bw=Math.max(320,Math.min(Math.round(r.width*dpr),1920));if(cv.width!==bw){cv.width=bw;cv.height=Math.round(bw*H/W)}SC=cv.width/W;PL.dirty=true}
new ResizeObserver(resize).observe(cv);
buildTexture();buildScenery();buildCave();resetGates();resize();syncUI();updateCaption(true);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{PL.dirty=true});
let last=performance.now(),ft=0,fn=0;
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(PL.playing){G+=dt;advance(dt);PL.dirty=true}
  if(PL.dirty){const t0=performance.now();render();PL.dirty=false;
    if(PL.playing&&QUALITY){ft+=performance.now()-t0;fn++;if(fn>=90){if(ft/fn>16)QUALITY=false;ft=0;fn=0}}}
  updateCaption();syncProgress();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
window.__PL=PL;window.__seek=seek;window.__render=render;window.__GS=()=>GS;
</script>
</html>
